name: Real Project Acceptance Orchestrator

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/run_real_project_acceptance_v1.py'
      - 'scripts/run_real_project_acceptance_v1.ps1'
      - 'engine/tests/v2/test_real_project_acceptance_v1.py'
      - '.github/workflows/real-project-acceptance.yml'
  pull_request:
    paths:
      - 'scripts/run_real_project_acceptance_v1.py'
      - 'scripts/run_real_project_acceptance_v1.ps1'
      - 'engine/tests/v2/test_real_project_acceptance_v1.py'
      - '.github/workflows/real-project-acceptance.yml'

jobs:
  acceptance-orchestrator-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install lightweight acceptance dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.2
      - name: Compile acceptance runner
        run: python -m compileall -q scripts/run_real_project_acceptance_v1.py engine/tests/v2/test_real_project_acceptance_v1.py
      - name: Check PowerShell wrapper parses
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/run_real_project_acceptance_v1.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
      - name: Run orchestrator contract tests
        run: python -m pytest -q engine/tests/v2/test_real_project_acceptance_v1.py
