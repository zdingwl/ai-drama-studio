name: Reference Video V2 CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.128.2 \
            pydantic==2.13.4 \
            SQLAlchemy==2.0.50 \
            python-multipart==0.0.29 \
            httpx==0.28.1 \
            numpy==2.1.3 \
            pytest==9.0.2

      - name: Compile V2 backend
        run: python -m compileall -q engine/app

      - name: Import FastAPI app
        run: python -c "from engine.app.main import app; assert app.version == '2.1.0'; print(app.title, app.version)"

      - name: Run V2 tests
        run: pytest

  frontend-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
