name: Apply TargetDialogue Current Read Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-target-dialogue-current-fix.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi==0.128.2 pydantic==2.13.4 SQLAlchemy==2.0.50 python-multipart==0.0.29 httpx==0.28.1 numpy==2.1.3 pytest==9.0.2

      - name: Apply exact current-fingerprint patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('engine/app/target_dialogue_v1.py')
          text = path.read_text(encoding='utf-8')

          old_helper = '''def _rows_for_source_keys(session: Any, project_id: str, source_keys: set[str]) -> list[TargetDialogue]:
              if not source_keys:
                  return []
              return list(session.scalars(
                  select(TargetDialogue)
                  .where(
                      TargetDialogue.project_id == project_id,
                      TargetDialogue.source_dialogue_key.in_(source_keys),
                  )
                  .order_by(TargetDialogue.episode_id, TargetDialogue.source_start_us, TargetDialogue.source_dialogue_key)
              ).all())
          '''
          new_helper = '''def _rows_for_source_keys(
              session: Any,
              project_id: str,
              source_keys: set[str],
              *,
              fingerprint: str,
          ) -> list[TargetDialogue]:
              """Load only rows that belong to the current SourceDramaSnapshot version.

              ``source_dialogue_key`` alone is not a version boundary: historical projection rows and
              future source revisions can coexist in the same project. Filtering by fingerprint at the
              SQL boundary guarantees they cannot enter current counts or audio materialization.
              """

              if not source_keys:
                  return []
              return list(session.scalars(
                  select(TargetDialogue)
                  .where(
                      TargetDialogue.project_id == project_id,
                      TargetDialogue.source_fingerprint == fingerprint,
                      TargetDialogue.source_dialogue_key.in_(source_keys),
                  )
                  .order_by(TargetDialogue.episode_id, TargetDialogue.source_start_us, TargetDialogue.source_dialogue_key)
              ).all())
          '''
          if text.count(old_helper) != 1:
              raise SystemExit(f'expected one helper block, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_call = '_rows_for_source_keys(session, project_id, source_keys)'
          new_call = '_rows_for_source_keys(session, project_id, source_keys, fingerprint=fingerprint)'
          if text.count(old_call) != 4:
              raise SystemExit(f'expected four current-read call sites, found {text.count(old_call)}')
          text = text.replace(old_call, new_call)
          path.write_text(text, encoding='utf-8')

      - name: Compile backend and migration tool
        run: python -m compileall -q engine/app scripts/migrate_target_dialogue_current_v1.py

      - name: Run focused pytest acceptance
        run: |
          python -m pytest -q \
            engine/tests/v2/test_target_dialogue_current_migration_v1.py \
            engine/tests/v2/test_target_dialogue_v1.py \
            engine/tests/unit/test_project_flow_state_v1.py

      - name: Commit only production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/app/target_dialogue_v1.py
          git diff --cached --check
          git commit -m 'fix: exclude historical target dialogue from current reads'
          git push origin HEAD:main
