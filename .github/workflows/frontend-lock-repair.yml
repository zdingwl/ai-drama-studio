name: Frontend Lock Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/frontend-lock-repair.yml

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate compatible lockfile
        working-directory: frontend
        run: npm install --save-dev --package-lock-only --ignore-scripts typescript@6.0.3

      - name: Verify clean install and type-aware build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit regenerated manifest and lockfile
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo 'No lockfile change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'fix(frontend): pin TypeScript 6 for vue-tsc compatibility'
          git push origin HEAD:main
